name: CI - testes e build

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Testes, cobertura e build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CI: 'true'
      # Os testes usam mocks. A chave real não pertence ao ambiente de CI.
      GEMINI_API_KEY: ''
    steps:
      - name: Obter código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Configurar Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar pelo lockfile
        run: npm ci --no-audit --no-fund

      - name: Verificar estrutura
        run: npm run check:structure

      - name: Testar backend e frontend com cobertura mínima de 70%
        id: tests
        run: npm run test:coverage

      - name: Compilar interface
        run: npm run build

      - name: Publicar cobertura do backend
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cobertura-backend
          path: backend/coverage/
          if-no-files-found: error
          retention-days: 14

      - name: Publicar cobertura do frontend
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cobertura-frontend
          path: frontend/coverage/
          if-no-files-found: error
          retention-days: 14

      - name: Publicar build verificado
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: build-frontend
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 14
